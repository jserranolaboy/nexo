<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nexo · iOS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e9ed;color:#262629;font-family:-apple-system,BlinkMacSystemFont,sans-serif;height:100dvh;overflow:hidden}header{height:70px;padding:0 26px;display:flex;align-items:center;justify-content:space-between}h1{font-size:19px;letter-spacing:-.6px;font-weight:600;margin:0}nav{display:flex;gap:3px;background:#dddde3;border-radius:22px;padding:4px}button{border:0;background:none;font:inherit;font-size:13px;padding:9px 22px;border-radius:18px;cursor:pointer;color:#737379}button[aria-pressed=true]{background:#fff;color:#262629;box-shadow:0 1px 4px #00000012}main{height:calc(100dvh - 86px);display:flex;justify-content:center;align-items:center;overflow:hidden}.device{width:414px;height:886px;padding:6px;background:#252528;border-radius:35px;box-shadow:0 15px 55px #00000025;flex-shrink:0;transform-origin:center}.device.tablet{width:846px;height:1206px;border-radius:27px}iframe{width:100%;height:100%;border:0;border-radius:29px;background:#f5f5f7;display:block}.tablet iframe{border-radius:21px}button:focus-visible{outline:2px solid #007aff}
</style>
</head>
<body>
<header><h1>Nexo</h1><nav aria-label="Dispositivo"><button aria-pressed="true" data-device="phone">iPhone</button><button aria-pressed="false" data-device="tablet">iPad</button></nav></header>
<main><div class="device"><iframe title="Nexo" src="/"></iframe></div></main>
<script>
const device=document.querySelector('.device'), stage=document.querySelector('main');
function fit(){const scale=Math.min(1,(stage.clientWidth-32)/device.offsetWidth,(stage.clientHeight-14)/device.offsetHeight);device.style.transform=`scale(${scale})`}
for(const button of document.querySelectorAll('nav button'))button.addEventListener('click',()=>{device.classList.toggle('tablet',button.dataset.device==='tablet');for(const item of document.querySelectorAll('nav button'))item.setAttribute('aria-pressed',String(item===button));fit()});
new ResizeObserver(fit).observe(stage);fit();
</script>
</body>
</html>
